version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unstuck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unstuck-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./scraper (2)/scraper/mostaql_scraper
      dockerfile: Dockerfile
    container_name: unstuck-backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SUPABASE_URL=${SUPABASE_URL:-https://rdwkjssobclvyxtcneqv.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-sb_secret_mvQNA87CyM96n-J2mAVG9g__2zABG5r}
      - GLM_API_KEY=${GLM_API_KEY:-613c172ccdf34cdeac8276de24b0ffec}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-am3365568@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-uonrzwbfmiubpwyy}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-am3365568@gmail.com}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unstuck-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: unstuck-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - UNSTUCK_API_URL=http://backend:8000
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend
    networks:
      - unstuck-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unstuck-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - unstuck-network

volumes:
  postgres_data:
  n8n_data:

networks:
  unstuck-network:
    driver: bridge
